# ================================================================================
# PostgreSQL 15 Production Configuration - Capimax Platform
# ================================================================================
#
# This configuration is optimized for a production server with:
# - 8 GB RAM
# - 4 CPU cores
# - SSD storage
# - Expected load: 1000-5000 concurrent connections
#
# Adjust values based on your actual hardware specifications.
#
# Location: /etc/postgresql/15/main/postgresql.conf (Ubuntu/Debian)
#          /var/lib/pgsql/15/data/postgresql.conf (RHEL/CentOS)
#
# After editing, reload configuration:
#   sudo systemctl reload postgresql
#
# To check current settings:
#   SHOW all;
#   SHOW shared_buffers;
#
# ================================================================================

# ================================================================================
# CONNECTION SETTINGS
# ================================================================================

# Maximum number of concurrent connections
# Capimax usage: API (100), Celery (20), Admin (10), Reserve (70)
max_connections = 200

# Connections reserved for superuser emergency access
superuser_reserved_connections = 3

# Maximum time to wait for connection (milliseconds)
# Prevents hanging connections
connection_timeout = 10000

# ================================================================================
# MEMORY SETTINGS
# ================================================================================

# Shared memory buffer for all connections
# Rule: 25% of system RAM (for 8GB = 2GB)
# This is the most important tuning parameter
shared_buffers = 2GB

# Memory for complex queries per connection
# Rule: shared_buffers / max_connections
# 2GB / 200 = ~10MB per connection
work_mem = 10MB

# Memory for maintenance operations (VACUUM, CREATE INDEX, etc.)
# Rule: 5-10% of system RAM
maintenance_work_mem = 512MB

# Memory for autovacuum workers
# Should be same as maintenance_work_mem
autovacuum_work_mem = 512MB

# Maximum memory for temporary tables and sorts across all connections
# Used when work_mem is exceeded
# Rule: 10-15% of system RAM
temp_buffers = 16MB

# Memory for hash operations
# Used for hash joins and hash aggregates
effective_cache_size = 6GB

# Memory for each parallel worker
# For parallel query execution
min_parallel_table_scan_size = 8MB
min_parallel_index_scan_size = 512kB

# ================================================================================
# QUERY PLANNER SETTINGS
# ================================================================================

# Estimated OS cache size for query planning
# Rule: 50-75% of system RAM
effective_cache_size = 6GB

# Random page cost (SSD optimized)
# Default is 4.0 for HDD, 1.1 for SSD
random_page_cost = 1.1

# Effective I/O concurrency (SSD optimized)
# Number of concurrent disk I/O operations
# For SSD: 200-300, for HDD: 2-4
effective_io_concurrency = 200

# Cost of CPU processing
# Lower = optimizer prefers CPU-intensive plans
# Higher = optimizer prefers I/O-intensive plans
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# Parallel query workers
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ================================================================================
# WRITE-AHEAD LOG (WAL) SETTINGS
# ================================================================================

# WAL level (replica = streaming replication, minimal = no replication)
# Use 'replica' for production with replication/backups
wal_level = replica

# WAL write mode
# Options: fsync (safest), fdatasync, open_sync
fsync = on
synchronous_commit = on

# WAL buffer size
# Rule: 3% of shared_buffers (2GB * 0.03 = ~64MB)
wal_buffers = 16MB

# WAL segment size (default 16MB)
# Increase for high write workloads
# wal_segment_size = 16MB  # Set at initdb, cannot change

# Number of WAL segments to keep for replication
# Each segment is 16MB (300 * 16MB = 4.8GB)
min_wal_size = 2GB
max_wal_size = 8GB

# WAL checkpoint settings
# Maximum time between automatic WAL checkpoints (5 minutes)
checkpoint_timeout = 5min

# Target for checkpoint completion as fraction of checkpoint_timeout
# 0.9 = checkpoint should complete in 90% of checkpoint_timeout
checkpoint_completion_target = 0.9

# WAL writer delay (milliseconds)
# How often WAL writer flushes WAL
wal_writer_delay = 200ms

# Archive WAL files for point-in-time recovery (PITR)
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/15/archive/%f'
archive_timeout = 3600  # Force archive every hour

# ================================================================================
# REPLICATION SETTINGS (if using replication)
# ================================================================================

# Maximum number of replication connections
max_wal_senders = 10

# Keep WAL segments for standby servers
wal_keep_size = 2GB

# Replication timeout (milliseconds)
wal_sender_timeout = 60s

# Hot standby configuration (for read replicas)
hot_standby = on
hot_standby_feedback = on
max_standby_streaming_delay = 30s

# ================================================================================
# AUTOVACUUM SETTINGS
# ================================================================================

# Enable autovacuum (critical for performance)
autovacuum = on

# Maximum number of autovacuum workers
autovacuum_max_workers = 3

# Naptime between autovacuum runs (seconds)
autovacuum_naptime = 20s

# Minimum number of row updates before vacuum
autovacuum_vacuum_threshold = 50

# Minimum number of row updates before analyze
autovacuum_analyze_threshold = 50

# Fraction of table size to add to threshold
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# Vacuum cost delay (milliseconds)
# Higher = slower vacuum, less impact on queries
autovacuum_vacuum_cost_delay = 10ms

# Vacuum cost limit
# Points accumulated before vacuum pauses
autovacuum_vacuum_cost_limit = 1000

# Freeze parameters (prevent transaction ID wraparound)
autovacuum_freeze_max_age = 200000000
autovacuum_multixact_freeze_max_age = 400000000

# ================================================================================
# LOGGING SETTINGS
# ================================================================================

# Where to log
# Options: stderr, csvlog, syslog, eventlog (Windows)
logging_collector = on
log_destination = 'stderr,csvlog'

# Log directory and file naming
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'

# Rotate logs daily
log_rotation_age = 1d
log_rotation_size = 100MB

# Keep logs for 7 days
log_truncate_on_rotation = off

# Log connections and disconnections
log_connections = on
log_disconnections = on

# Log slow queries (queries taking longer than 1 second)
log_min_duration_statement = 1000

# Log query duration
log_duration = off
log_statement = 'mod'  # Log DDL and DML statements

# Log lock waits longer than deadlock_timeout
log_lock_waits = on

# Log temporary files larger than 10MB
log_temp_files = 10MB

# Log checkpoints for performance monitoring
log_checkpoints = on

# Log autovacuum activity
log_autovacuum_min_duration = 250ms

# Include error severity in log prefix
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Log timezone
log_timezone = 'UTC'

# Error severity levels to log
# Options: DEBUG5, DEBUG4, DEBUG3, DEBUG2, DEBUG1, INFO, NOTICE, WARNING, ERROR, LOG, FATAL, PANIC
client_min_messages = notice
log_min_messages = warning
log_min_error_statement = error

# ================================================================================
# QUERY PERFORMANCE SETTINGS
# ================================================================================

# Statement timeout (30 seconds)
# Prevents long-running queries from blocking resources
statement_timeout = 30000

# Lock timeout (10 seconds)
# Maximum time to wait for a lock
lock_timeout = 10000

# Idle in transaction timeout (5 minutes)
# Kills idle transactions to free resources
idle_in_transaction_session_timeout = 300000

# Deadlock timeout (1 second)
deadlock_timeout = 1s

# Enable parallel query execution
max_parallel_workers_per_gather = 2
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0

# ================================================================================
# STATISTICS SETTINGS
# ================================================================================

# Track query execution statistics
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# Update statistics for query planning
autovacuum_analyze_scale_factor = 0.05
default_statistics_target = 100

# Statistics collection
stats_temp_directory = '/var/run/postgresql/15-main.pg_stat_tmp'

# ================================================================================
# CLIENT CONNECTION DEFAULTS
# ================================================================================

# Default timezone
timezone = 'UTC'

# Date/time format
datestyle = 'iso, mdy'

# Locale settings
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# Default text search configuration
default_text_search_config = 'pg_catalog.english'

# ================================================================================
# SECURITY SETTINGS
# ================================================================================

# SSL configuration (enable for production)
ssl = on
ssl_cert_file = '/etc/postgresql/15/main/server.crt'
ssl_key_file = '/etc/postgresql/15/main/server.key'
ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.2'

# Password encryption
password_encryption = scram-sha-256

# Connection encryption
# Options: prefer (try SSL), require (must use SSL), disable
# For production, use 'require' in pg_hba.conf instead

# ================================================================================
# EXTENSION SETTINGS
# ================================================================================

# Shared preload libraries
# Load extensions at server start for better performance
shared_preload_libraries = 'pg_stat_statements'

# pg_stat_statements settings (query performance tracking)
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# ================================================================================
# MISCELLANEOUS SETTINGS
# ================================================================================

# Unix socket directory
unix_socket_directories = '/var/run/postgresql'

# TCP/IP settings
listen_addresses = '*'
port = 5432

# Huge pages (for better memory management with large shared_buffers)
# Options: off, on, try
huge_pages = try

# Kernel buffer size for disk I/O
# Should match OS setting
# sysctl -w vm.dirty_background_ratio=5
# sysctl -w vm.dirty_ratio=10

# Maximum file size for temporary files (10GB)
temp_file_limit = 10GB

# Allow JIT compilation (PostgreSQL 11+)
# Speeds up complex queries
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# ================================================================================
# MONITORING SETTINGS
# ================================================================================

# Enable pg_stat_statements extension for query monitoring
# Install: CREATE EXTENSION pg_stat_statements;

# Query monitoring views:
# - pg_stat_activity: Current running queries
# - pg_stat_database: Database-wide statistics
# - pg_stat_user_tables: Table access statistics
# - pg_stat_user_indexes: Index usage statistics
# - pg_statio_user_tables: I/O statistics

# ================================================================================
# PERFORMANCE TUNING RECOMMENDATIONS
# ================================================================================

# For SSD storage:
# - random_page_cost = 1.1
# - effective_io_concurrency = 200

# For HDD storage:
# - random_page_cost = 4.0
# - effective_io_concurrency = 2

# For read-heavy workload:
# - Increase shared_buffers (up to 40% of RAM)
# - Increase effective_cache_size (up to 75% of RAM)

# For write-heavy workload:
# - Increase wal_buffers (up to 16MB)
# - Increase checkpoint_timeout (up to 15min)
# - Increase max_wal_size (up to 16GB)

# For high concurrency:
# - Decrease work_mem (to 5-8MB)
# - Increase max_connections (with connection pooling)
# - Use pgBouncer or PgPool-II for connection pooling

# ================================================================================
# MAINTENANCE COMMANDS
# ================================================================================

# Run VACUUM ANALYZE regularly:
# VACUUM ANALYZE;

# Check table bloat:
# SELECT schemaname, tablename,
#        pg_size_pretty(pg_total_relation_size(schemaname||'.'||tablename)) AS size
# FROM pg_tables
# WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
# ORDER BY pg_total_relation_size(schemaname||'.'||tablename) DESC;

# Check index usage:
# SELECT schemaname, tablename, indexname, idx_scan, idx_tup_read, idx_tup_fetch
# FROM pg_stat_user_indexes
# ORDER BY idx_scan DESC;

# Check slow queries:
# SELECT query, calls, total_time, mean_time, max_time
# FROM pg_stat_statements
# ORDER BY mean_time DESC
# LIMIT 20;

# ================================================================================
# END OF CONFIGURATION
# ================================================================================
