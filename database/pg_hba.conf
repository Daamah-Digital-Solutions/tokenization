# ================================================================================
# PostgreSQL Client Authentication Configuration - Capimax Platform
# ================================================================================
#
# This file controls: which hosts are allowed to connect, how clients
# are authenticated, which PostgreSQL user names they can use, which
# databases they can access.
#
# Location: /etc/postgresql/15/main/pg_hba.conf (Ubuntu/Debian)
#          /var/lib/pgsql/15/data/pg_hba.conf (RHEL/CentOS)
#
# Format:
# TYPE  DATABASE        USER            ADDRESS                 METHOD
#
# TYPE: local (Unix socket), host (TCP/IP), hostssl (SSL), hostnossl
# DATABASE: database name, "all", "sameuser", "samerole", "replication"
# USER: PostgreSQL username, "all"
# ADDRESS: IP address, hostname, CIDR range
# METHOD: trust, reject, md5, scram-sha-256, password, peer, ident, etc.
#
# After editing, reload configuration:
#   sudo systemctl reload postgresql
#
# ================================================================================

# ================================================================================
# LOCAL CONNECTIONS (Unix domain sockets)
# ================================================================================

# Allow local superuser access for maintenance
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             postgres                                peer

# Allow local connections from application server
# Use scram-sha-256 for security (requires PostgreSQL 10+)
local   all             all                                     scram-sha-256

# ================================================================================
# IPv4 LOCAL CONNECTIONS
# ================================================================================

# Localhost connections (application on same server)
host    all             all             127.0.0.1/32            scram-sha-256

# Application server connections (replace with your app server IP)
# Example: host    capimax_db      capimax_user    10.0.1.100/32           scram-sha-256
host    capimax_db      capimax_user    0.0.0.0/0               scram-sha-256

# Celery worker connections (if on separate servers)
# host    capimax_db      capimax_user    10.0.1.101/32           scram-sha-256

# Admin connections from trusted IPs only
# Replace with your actual admin IP addresses
# host    all             postgres        203.0.113.10/32         scram-sha-256
# host    all             postgres        203.0.113.11/32         scram-sha-256

# ================================================================================
# IPv6 LOCAL CONNECTIONS
# ================================================================================

# Localhost IPv6
host    all             all             ::1/128                 scram-sha-256

# ================================================================================
# REPLICATION CONNECTIONS
# ================================================================================

# Replication user for streaming replication (standby servers)
# Replace 10.0.2.0/24 with your replication server subnet
# local   replication     replication_user                        scram-sha-256
# host    replication     replication_user    10.0.2.0/24         scram-sha-256
# host    replication     replication_user    ::1/128             scram-sha-256

# ================================================================================
# BACKUP CONNECTIONS
# ================================================================================

# Backup user for pg_dump / pg_basebackup
# Allow from backup server IP
# host    all             backup_user     10.0.3.100/32           scram-sha-256

# ================================================================================
# MONITORING CONNECTIONS
# ================================================================================

# Monitoring user for health checks and metrics
# Allow from monitoring server
# host    capimax_db      monitoring_user 10.0.4.100/32           scram-sha-256

# ================================================================================
# SSL CONNECTIONS (Production)
# ================================================================================

# Require SSL for all external connections (uncomment for production)
# hostssl    capimax_db      capimax_user    0.0.0.0/0               scram-sha-256
# hostssl    all             postgres        0.0.0.0/0               scram-sha-256
# hostnossl  all             all             0.0.0.0/0               reject

# ================================================================================
# DENY ALL OTHER CONNECTIONS
# ================================================================================

# Explicitly reject all other connections
# This should be the last line
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject

# ================================================================================
# SECURITY NOTES
# ================================================================================

# 1. Always use specific IP addresses or subnets, not 0.0.0.0/0
# 2. Use scram-sha-256 authentication (most secure)
# 3. Require SSL for all external connections
# 4. Limit database access per user (don't use "all")
# 5. Use separate users for different purposes:
#    - capimax_user: Application user (limited privileges)
#    - postgres: Superuser (admin only, trusted IPs)
#    - backup_user: Backup operations only
#    - replication_user: Replication only
#    - monitoring_user: Read-only metrics
#
# 6. Test configuration after changes:
#    psql -h hostname -U username -d database
#
# 7. Check active connections:
#    SELECT * FROM pg_stat_activity;
#
# 8. Reload without restart:
#    sudo systemctl reload postgresql
#
# ================================================================================
# AUTHENTICATION METHODS
# ================================================================================

# trust        - Allow connection without password (INSECURE)
# reject       - Reject connection unconditionally
# scram-sha-256 - Password encrypted with SCRAM-SHA-256 (RECOMMENDED)
# md5          - Password encrypted with MD5 (legacy, less secure)
# password     - Password sent in clear text (INSECURE)
# peer         - Use OS username (local connections only)
# ident        - Use ident server (local connections only)
# cert         - SSL certificate authentication

# ================================================================================
# USER SETUP COMMANDS
# ================================================================================

# Create application user:
# CREATE USER capimax_user WITH PASSWORD 'strong_password_here';
# GRANT CONNECT ON DATABASE capimax_db TO capimax_user;
# GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO capimax_user;
# GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO capimax_user;

# Create backup user:
# CREATE USER backup_user WITH PASSWORD 'backup_password_here';
# GRANT CONNECT ON DATABASE capimax_db TO backup_user;
# GRANT SELECT ON ALL TABLES IN SCHEMA public TO backup_user;

# Create monitoring user:
# CREATE USER monitoring_user WITH PASSWORD 'monitoring_password_here';
# GRANT CONNECT ON DATABASE capimax_db TO monitoring_user;
# GRANT SELECT ON pg_stat_database TO monitoring_user;

# Create replication user:
# CREATE USER replication_user WITH REPLICATION PASSWORD 'replication_password_here';

# ================================================================================
# TROUBLESHOOTING
# ================================================================================

# Connection refused:
# - Check PostgreSQL is running: sudo systemctl status postgresql
# - Check listen_addresses in postgresql.conf
# - Check firewall rules: sudo ufw status

# Authentication failed:
# - Verify username and password
# - Check pg_hba.conf order (first match wins)
# - Check authentication method (scram-sha-256 vs md5)
# - Verify user exists: SELECT * FROM pg_user;

# SSL errors:
# - Check ssl = on in postgresql.conf
# - Verify certificate files exist and are readable
# - Check SSL method in pg_hba.conf (hostssl vs host)

# ================================================================================
# END OF CONFIGURATION
# ================================================================================
