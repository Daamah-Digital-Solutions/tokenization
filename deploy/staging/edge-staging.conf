# Edge-nginx server block for capimaxrt.tech (apex + www).
#
# Mounted into the EXISTING capimax_nginx container at
# /etc/nginx/conf.d/staging.conf so it lives alongside the capimaxrt.com
# default.conf. We do NOT modify the existing default.conf.
#
# Lifecycle:
#   1) DNS A records point capimaxrt.tech and www.capimaxrt.tech to 72.62.38.231
#   2) HTTP server below answers ACME challenges so certbot can issue a cert
#   3) Once the cert is in /etc/letsencrypt/live/capimaxrt.tech/,
#      the HTTPS server block becomes active. Until then nginx logs a
#      cert-not-found warning but the HTTP block still works.

upstream staging_django {
    server staging_web:8000;
    keepalive 32;
}

upstream staging_frontend_upstream {
    server staging_frontend:80;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name capimaxrt.tech www.capimaxrt.tech;

    # Let's Encrypt webroot challenge — must NOT redirect to https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Everything else upgrades to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.capimaxrt.tech;

    ssl_certificate     /etc/letsencrypt/live/capimaxrt.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capimaxrt.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Canonicalize www -> apex.
    return 301 https://capimaxrt.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name capimaxrt.tech;

    client_max_body_size 25M;

    ssl_certificate     /etc/letsencrypt/live/capimaxrt.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capimaxrt.tech/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:STAGINGSSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Django API
    location /api/ {
        proxy_pass http://staging_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://staging_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Django static & media (served by Django via WhiteNoise in staging.py,
    # but we also expose them through the upstream for completeness).
    location /static/ {
        proxy_pass http://staging_django;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        proxy_pass http://staging_django;
        proxy_set_header Host $host;
    }

    # WebSockets (notifications, live property/investment updates).
    location /ws/ {
        proxy_pass http://staging_django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else -> React SPA
    location / {
        proxy_pass http://staging_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
