# Edge-nginx server blocks for the platform.
#
# capimaxrt.com is the site. capimaxrt.tech (the first address) redirects to it,
# except /api/ and /ws/ (webhooks registered on .tech, sessions still open there)
# and /sw.js (a service worker that removes itself, so a copy installed from .tech
# stops serving the old cached app and follows the redirect).
#
# Mounted into the EXISTING capimax_nginx container at
# /etc/nginx/conf.d/staging.conf, alongside the legacy default.conf, which these
# blocks shadow. We do NOT modify the existing default.conf.
#
# Lifecycle:
#   1) DNS A records point capimaxrt.tech and www.capimaxrt.tech to 72.62.38.231
#   2) HTTP server below answers ACME challenges so certbot can issue a cert
#   3) Once the cert is in /etc/letsencrypt/live/capimaxrt.tech/,
#      the HTTPS server block becomes active. Until then nginx logs a
#      cert-not-found warning but the HTTP block still works.

upstream staging_django {
    server staging_web:8000;
    keepalive 32;
}

upstream staging_frontend_upstream {
    server staging_frontend:80;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name capimaxrt.tech www.capimaxrt.tech;

    # Let's Encrypt webroot challenge — must NOT redirect (the .tech cert is
    # still renewed so the HTTPS redirect below keeps working).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://capimaxrt.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.capimaxrt.tech;

    ssl_certificate     /etc/letsencrypt/live/capimaxrt.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capimaxrt.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://capimaxrt.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name capimaxrt.tech;

    client_max_body_size 25M;

    ssl_certificate     /etc/letsencrypt/live/capimaxrt.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capimaxrt.tech/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:STAGINGSSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Payment / KYC webhooks and callbacks registered on .tech keep reaching Django
    # (providers do not follow a redirect on a POST).
    location /api/ {
        proxy_pass http://staging_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Sessions opened on .tech before the switch.
    location /ws/ {
        proxy_pass http://staging_django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The app installed from .tech: its service worker is replaced by one that
    # removes itself and reloads the page, which then follows the redirect.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        return 200 "self.addEventListener('install',function(){self.skipWaiting()});self.addEventListener('activate',function(e){e.waitUntil(self.registration.unregister().then(function(){return self.clients.matchAll({type:'window'})}).then(function(cs){cs.forEach(function(c){c.navigate(c.url)})}))});";
    }

    # Everything else moves to the main address.
    location / {
        return 301 https://capimaxrt.com$request_uri;
    }
}

# ---- capimaxrt.com: the site ----
server {
    listen 80;
    listen [::]:80;
    server_name capimaxrt.com www.capimaxrt.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.capimaxrt.com;

    ssl_certificate     /etc/letsencrypt/live/capimaxrt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capimaxrt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://capimaxrt.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name capimaxrt.com;

    client_max_body_size 25M;

    ssl_certificate     /etc/letsencrypt/live/capimaxrt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capimaxrt.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:STAGINGSSLCOM:20m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Django API
    location /api/ {
        proxy_pass http://staging_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://staging_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Django static — served directly from disk via the capimax_staging_static
    # volume mounted into this nginx. WhiteNoise isn't in MIDDLEWARE, so
    # proxying to Django returns 404. This matches the existing prod pattern.
    location /static/ {
        alias /usr/share/nginx/staging-static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # KYC identity files are private (served only via the authenticated API).
    location ^~ /media/kyc_documents/ {
        return 404;
    }

    # Broker / LP application documents are private (staff download them in the admin).
    location ^~ /media/partner_documents/ {
        return 404;
    }
    location ^~ /media/broker_applications/ {
        return 404;
    }

    location /media/ {
        alias /usr/share/nginx/staging-media/;
        try_files $uri =404;
    }

    # WebSockets (notifications, live property/investment updates).
    location /ws/ {
        proxy_pass http://staging_django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else -> React SPA
    location / {
        proxy_pass http://staging_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
