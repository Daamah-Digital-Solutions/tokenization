# Capimax STAGING deployment — serves capimaxrt.tech
#
# Runs SIDE-BY-SIDE with the existing capimaxrt.com production deploy.
# - Fully isolated: own Postgres, own Redis, own code volume, own DB/users.
# - Shares the EXISTING edge nginx (capimax_nginx) by joining the external
#   `capimax_net` network and exposing aliases that the edge nginx proxies to.
# - All containers prefixed `capimax_staging_` so they're easy to identify.
#
# Networks
# --------
# - staging_net (NEW): internal-only network for db/redis/web/frontend
# - edge_net (EXTERNAL): the existing `capimax_net` — web + frontend join it
#   so the existing edge nginx can reach them by alias (staging_web,
#   staging_frontend).
#
# Volumes
# -------
# All prefixed `capimax_staging_` so they never collide with the prod deploy.

name: capimax-staging

services:
  db:
    image: postgres:15-alpine
    container_name: capimax_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capimax_staging}
      POSTGRES_USER: ${POSTGRES_USER:-capimax_staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capimax_staging_user} -d ${POSTGRES_DB:-capimax_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging_net

  redis:
    image: redis:7-alpine
    container_name: capimax_staging_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging_net

  # One-shot container that clones the repo, builds the React bundle into the
  # frontend_dist volume, then exits. The persistent frontend container picks
  # up the bundle from the volume.
  frontend_builder:
    image: node:20-alpine
    container_name: capimax_staging_frontend_builder
    env_file: .env
    volumes:
      - frontend_dist:/app/dist
    networks:
      - staging_net
    # IMPORTANT: build the .env one line per command. An earlier
    # implementation used `printf 'A=…\nB=…\n'` to write the whole file in
    # one call; YAML folded-scalar handling silently flattened every `\n`
    # to a literal `n` so the resulting file was one giant line. Vite then
    # baked the entire content into VITE_API_URL. Chained echoes are
    # unambiguous and don't depend on escape-sequence interpretation.
    command: >
      sh -c "set -e &&
      apk add --no-cache curl &&
      mkdir -p /tmp/build &&
      echo 'Fetching tokenization@'$${GIT_REF:-main}' …' &&
      curl -fsSL https://github.com/Daamah-Digital-Solutions/tokenization/archive/$${GIT_REF:-main}.tar.gz | tar -xz -C /tmp/build --strip-components=1 &&
      cd /tmp/build/capimax-preview &&
      : > .env &&
      echo 'VITE_API_URL=https://capimaxrt.tech/api/v1' >> .env &&
      echo 'VITE_WEBSOCKET_URL=wss://capimaxrt.tech/ws' >> .env &&
      echo \"VITE_STRIPE_PUBLISHABLE_KEY=$${VITE_STRIPE_PUBLISHABLE_KEY}\" >> .env &&
      echo \"VITE_GOOGLE_CLIENT_ID=$${VITE_GOOGLE_CLIENT_ID}\" >> .env &&
      echo \"VITE_WALLET_CONNECT_PROJECT_ID=$${VITE_WALLET_CONNECT_PROJECT_ID:-}\" >> .env &&
      echo 'VITE_ENABLE_CRYPTO_PAYMENTS=true' >> .env &&
      echo 'VITE_ENABLE_WEBSOCKETS=true' >> .env &&
      echo 'VITE_ENABLE_2FA=true' >> .env &&
      echo 'VITE_SUPPORTED_CHAINS=97' >> .env &&
      echo '--- generated frontend .env ---' && cat .env &&
      npm install --no-audit --no-fund &&
      npm run build &&
      rm -rf /app/dist/* && cp -r dist/. /app/dist/ &&
      echo 'Staging frontend build complete' &&
      ls -la /app/dist"

  frontend:
    image: nginx:1.25-alpine
    container_name: capimax_staging_frontend
    restart: unless-stopped
    depends_on:
      frontend_builder:
        condition: service_completed_successfully
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      staging_net:
      edge_net:
        aliases:
          - staging_frontend

  web:
    image: python:3.11-slim
    container_name: capimax_staging_web
    restart: unless-stopped
    env_file: .env
    environment:
      # These guarantee Django picks the right settings even if .env omits them.
      ENVIRONMENT: staging
      DJANGO_SETTINGS_MODULE: capimax_backend.settings
    volumes:
      - app_src:/app
      - static_files:/app/capimax_backend/staticfiles
      - media_files:/app/capimax_backend/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    networks:
      staging_net:
      edge_net:
        aliases:
          - staging_web
    command: >
      bash -c "set -e &&
      apt-get update && apt-get install -y --no-install-recommends curl libpq-dev gcc python3-dev build-essential &&
      mkdir -p /app/logs &&
      if [ ! -f /app/.fetched ]; then
        echo 'Fetching tokenization@'$${GIT_REF:-main}' …' &&
        curl -fsSL https://github.com/Daamah-Digital-Solutions/tokenization/archive/$${GIT_REF:-main}.tar.gz | tar -xz -C /app --strip-components=1 &&
        touch /app/.fetched
      fi &&
      cd /app/capimax_backend &&
      pip install -q --no-cache-dir -r requirements.txt python-json-logger gunicorn &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py promote_admin admin@capimaxrt.tech --create-if-missing --superuser --password=\"$${ADMIN_INITIAL_PASSWORD:-ChangeMeNow2026!}\" || echo 'Admin bootstrap failed (non-fatal)' &&
      echo 'Starting Daphne (ASGI — supports WebSockets) on :8000' &&
      daphne -b 0.0.0.0 -p 8000 --proxy-headers --access-log - capimax_backend.asgi:application"

networks:
  staging_net:
    name: capimax_staging_net
    driver: bridge
  edge_net:
    name: capimax_net
    external: true

volumes:
  postgres_data:
    name: capimax_staging_postgres_data
  frontend_dist:
    name: capimax_staging_frontend_dist
  app_src:
    name: capimax_staging_app_src
  static_files:
    name: capimax_staging_static
  media_files:
    name: capimax_staging_media
