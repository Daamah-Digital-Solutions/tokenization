# Internal nginx config for the capimax_staging_frontend container.
# This nginx ONLY serves the static React bundle. The edge nginx
# (capimax_nginx) terminates TLS and forwards SPA traffic here, and forwards
# /api/ + /admin/ + /ws/ directly to capimax_staging_web (Daphne) bypassing
# this container. So this file only needs the static-file fallback.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed bundle assets, short for index.html
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA fallback: any unknown path resolves to index.html so React
        # Router can handle client-side routing.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Lightweight health probe used by the edge nginx for upstream checks.
    location = /_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
