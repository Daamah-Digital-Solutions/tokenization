# =============================================================================
# CapimaxRT API — production virtual host
# =============================================================================
# Domain placeholders below MUST be replaced at deploy time. Recommend using
# envsubst or a simple shell template in the deploy script:
#   envsubst '${API_DOMAIN} ${ADMIN_DOMAIN}' < capimax.conf.template > capimax.conf
# =============================================================================

# ---------- HTTP -> HTTPS redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.capimax.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS API ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.capimax.com;

    ssl_certificate     /etc/letsencrypt/live/api.capimax.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.capimax.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.capimax.com/chain.pem;

    # Generate unique request ID for tracing through the stack
    add_header X-Request-ID $request_id always;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ---- Connection limits ----
    limit_conn connlimit 50;

    # ---- Static / Media ----
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- WebSocket endpoint ----
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ---- Auth endpoints (tighter rate limit) ----
    location ~ ^/api/v1/auth/(login|register|password) {
        limit_req zone=api_auth burst=5 nodelay;
        include /etc/nginx/conf.d/_proxy_app.conf;
    }

    # ---- Payment endpoints (medium rate limit, no caching) ----
    location ~ ^/api/v1/payments/ {
        limit_req zone=api_payment burst=10 nodelay;
        proxy_cache off;
        include /etc/nginx/conf.d/_proxy_app.conf;
    }

    # ---- Webhook endpoints (high rate, no limit_req — providers retry) ----
    location ~ ^/api/v1/payments/(webhooks|nowpayments/ipn) {
        proxy_buffering off;
        include /etc/nginx/conf.d/_proxy_app.conf;
    }

    # ---- All other API endpoints ----
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        include /etc/nginx/conf.d/_proxy_app.conf;
    }

    # ---- Django admin behind path-based ACL ----
    location /admin/ {
        # Restrict admin to corporate IPs only
        # allow 198.51.100.0/24;  # example office range
        # deny all;
        include /etc/nginx/conf.d/_proxy_app.conf;
    }

    # Default — block everything else
    location / {
        return 404;
    }
}

# ---------- Prometheus / Grafana / Flower — internal ops domain ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ops.capimax.com;

    ssl_certificate     /etc/letsencrypt/live/ops.capimax.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.capimax.com/privkey.pem;

    # All ops endpoints require basic auth on top of upstream auth
    auth_basic "Capimax Ops";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # IP allowlist — adjust to your office / VPN ranges
    # allow 198.51.100.0/24;
    # deny all;

    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        include /etc/nginx/conf.d/_proxy_common.conf;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/;
        include /etc/nginx/conf.d/_proxy_common.conf;
    }

    location /flower/ {
        proxy_pass http://flower:5555/;
        include /etc/nginx/conf.d/_proxy_common.conf;
    }
}
