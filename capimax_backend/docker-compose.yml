version: '3.8'

services:
  # Django Application
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: capimax_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=capimax_backend.settings_production
      - DEBUG=False
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - capimax_network
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        gunicorn --bind 0.0.0.0:8000 
        --workers 4 
        --worker-class gevent 
        --worker-connections 1000 
        --timeout 30 
        --keep-alive 2 
        --max-requests 1000 
        --max-requests-jitter 100 
        --access-logfile - 
        --error-logfile - 
        capimax_backend.wsgi:application
      "

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: capimax_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      POSTGRES_DB: ${DB_NAME:-capimax}
      POSTGRES_USER: ${DB_USER:-capimax}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - capimax_network
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: capimax_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - capimax_network

  # Celery Worker
  celery:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: capimax_celery
    restart: unless-stopped
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=capimax_backend.settings_production
      - DEBUG=False
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - capimax_network
    command: celery -A capimax_backend worker -l info --concurrency=4

  # Celery Beat Scheduler
  celery-beat:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: capimax_celery_beat
    restart: unless-stopped
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - celery_data:/app/celerybeat
    environment:
      - DJANGO_SETTINGS_MODULE=capimax_backend.settings_production
      - DEBUG=False
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - capimax_network
    command: celery -A capimax_backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # Nginx Reverse Proxy & Static Files
  nginx:
    image: nginx:alpine
    container_name: capimax_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
    networks:
      - capimax_network

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: capimax_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - capimax_network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: capimax_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - capimax_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  celery_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  capimax_network:
    driver: bridge