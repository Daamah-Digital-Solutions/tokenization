# Prometheus scrape config for CapimaxRT
#
# Scrapes:
#   - Django app via django-prometheus exporter at /metrics
#   - Celery worker exporter (flower or celery-exporter)
#   - Postgres exporter
#   - Redis exporter
#   - Node exporter (host metrics)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # AlertManager address — adjust when deployed
            - alertmanager:9093

scrape_configs:
  - job_name: 'capimax_django'
    metrics_path: /metrics
    static_configs:
      - targets: ['web:8000']

  - job_name: 'celery'
    static_configs:
      - targets: ['flower:5555']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']

  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']
