[tool:pytest]
DJANGO_SETTINGS_MODULE = capimax_backend.settings_test
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
# Pre-existing dead test fixtures are skipped via `collect_ignore` in
# conftest.py (--ignore in addopts is unreliable on Windows path resolution).
addopts =
    -p no:pytest_ethereum
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=85
    --reuse-db
testpaths = .
filterwarnings =
    ignore::django.utils.deprecation.RemovedInDjango50Warning
    ignore::DeprecationWarning
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    websocket: marks tests as websocket tests
    performance: marks tests as performance tests
    slow: marks tests as slow running tests