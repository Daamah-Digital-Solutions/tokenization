# ================================================================================
# CAPIMAX PRODUCTION NGINX CONFIGURATION
# ================================================================================
#
# This configuration file sets up:
# - HTTPS with SSL/TLS certificates
# - Reverse proxy for Django backend API
# - Static file serving for React frontend
# - WebSocket support for real-time features
# - Security headers (HSTS, CSP, etc.)
# - Rate limiting
# - Gzip compression
# - Caching strategies
#
# Installation: sudo ln -s /path/to/this/file /etc/nginx/sites-enabled/capimax.conf
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx
#
# ================================================================================

# Rate Limiting Zones
# ================================================================================
# Define rate limiting zones before server blocks

# API Rate Limiting: 10 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Auth Rate Limiting: 5 requests per minute per IP (stricter for login/register)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Payment Rate Limiting: 3 requests per minute per IP (strictest for payments)
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=3r/m;

# WebSocket connections: 100 per IP
limit_conn_zone $binary_remote_addr zone=ws_limit:10m;

# Connection limiting: Max 50 concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ================================================================================
# UPSTREAM SERVERS
# ================================================================================

# Django Backend Application
upstream django_backend {
    # Use Unix socket for better performance (if Django runs on same server)
    # server unix:/run/gunicorn/capimax.sock fail_timeout=10s max_fails=3;

    # Or use TCP socket
    server 127.0.0.1:8000 fail_timeout=10s max_fails=3;

    # For load balancing (multiple backend instances):
    # server 127.0.0.1:8001 fail_timeout=10s max_fails=3;
    # server 127.0.0.1:8002 fail_timeout=10s max_fails=3;

    keepalive 32;
}

# ================================================================================
# HTTP SERVER - Redirect to HTTPS
# ================================================================================

server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain
    server_name capimaxinvestment.com www.capimaxinvestment.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ================================================================================
# HTTPS SERVER - Main Application
# ================================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Replace with your actual domain
    server_name capimaxinvestment.com www.capimaxinvestment.com;

    # Root directory for static files (frontend build)
    root /var/www/capimax/dist;
    index index.html;

    # Maximum upload size (for KYC documents, property images)
    client_max_body_size 10M;

    # Connection limiting
    limit_conn conn_limit 50;

    # ============================================================================
    # SSL/TLS CONFIGURATION
    # ============================================================================

    # SSL Certificate paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/capimaxinvestment.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capimaxinvestment.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/capimaxinvestment.com/chain.pem;

    # SSL Protocols - Only TLS 1.2 and 1.3
    ssl_protocols TLSv1.2 TLSv1.3;

    # SSL Ciphers - Strong ciphers only
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ============================================================================
    # SECURITY HEADERS
    # ============================================================================

    # HSTS - Force HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.capimaxinvestment.com wss://api.capimaxinvestment.com https://*.infura.io https://*.alchemy.com; frame-src 'self' https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # XSS Protection
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy (formerly Feature Policy)
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=(self)" always;

    # ============================================================================
    # LOGGING
    # ============================================================================

    access_log /var/log/nginx/capimax_access.log combined;
    error_log /var/log/nginx/capimax_error.log warn;

    # ============================================================================
    # BACKEND API PROXY
    # ============================================================================

    # API endpoints - Apply rate limiting
    location /api/ {
        # Rate limiting: 10 requests per second, burst of 20
        limit_req zone=api_limit burst=20 nodelay;

        # Proxy settings
        proxy_pass http://django_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Disable caching for API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Authentication endpoints - Stricter rate limiting
    location ~ ^/api/v1/auth/(login|register|password) {
        # Rate limiting: 5 requests per minute
        limit_req zone=auth_limit burst=3 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No caching for auth
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Payment endpoints - Strictest rate limiting
    location /api/v1/payments/ {
        # Rate limiting: 3 requests per minute
        limit_req zone=payment_limit burst=2 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for payment processing
        proxy_read_timeout 120s;

        # No caching
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Django Admin (optional - consider restricting by IP)
    location /admin/ {
        # Uncomment to restrict to specific IPs:
        # allow 203.0.113.0/24;  # Office IP range
        # deny all;

        proxy_pass http://django_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================================
    # WEBSOCKET PROXY
    # ============================================================================

    location /ws/ {
        # Connection limiting
        limit_conn ws_limit 100;

        # WebSocket proxy
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # ============================================================================
    # STATIC FILES (Django)
    # ============================================================================

    location /static/ {
        alias /var/www/capimax/staticfiles/;

        # Cache static files for 1 year
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Enable gzip
        gzip_static on;
    }

    # Media files (user uploads - KYC documents, property images)
    location /media/ {
        alias /var/www/capimax/media/;

        # Shorter cache for media (1 week)
        expires 7d;
        add_header Cache-Control "public";

        # Security: Prevent execution of uploaded files
        location ~ \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }

    # ============================================================================
    # FRONTEND (React SPA)
    # ============================================================================

    # Static assets from React build (JS, CSS, images)
    location /assets/ {
        alias /var/www/capimax/dist/assets/;

        # Aggressive caching for hashed assets
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Enable gzip
        gzip_static on;

        # CORS headers for fonts and other assets
        add_header Access-Control-Allow-Origin "*";
    }

    # Service Worker (if applicable)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Manifest and other meta files
    location ~ \.(manifest|webmanifest|xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # React Router - SPA fallback
    # All non-API, non-static requests should serve index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Cache HTML for 1 hour
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ============================================================================
    # GZIP COMPRESSION
    # ============================================================================

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ============================================================================
    # ERROR PAGES
    # ============================================================================

    # Custom error pages (optional)
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /var/www/capimax/dist;
    }
}

# ================================================================================
# OPTIONAL: WWW to NON-WWW REDIRECT (or vice versa)
# ================================================================================

# Redirect www to non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.capimaxinvestment.com;

    ssl_certificate /etc/letsencrypt/live/capimaxinvestment.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capimaxinvestment.com/privkey.pem;

    return 301 https://capimaxinvestment.com$request_uri;
}

# ================================================================================
# END OF CONFIGURATION
# ================================================================================
